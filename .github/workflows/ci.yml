name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify repository boundary
        run: uv run python scripts/repo_boundary.py .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Verify workspace controller
        run: node --test tests/workspace_client.test.cjs

      - name: Verify installed distribution
        run: |
          uv build --wheel --sdist --out-dir "$RUNNER_TEMP/workbench-dist"
          uv venv "$RUNNER_TEMP/workbench-install"
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/workbench-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/workbench-install/bin/python" --require-hashes --requirements "$RUNNER_TEMP/workbench-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/workbench-install/bin/python" --no-deps "$RUNNER_TEMP/workbench-dist/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/workbench-install/bin/agent-workbench" --help
          "$RUNNER_TEMP/workbench-install/bin/python" -I -c 'import importlib, pkgutil, local_agent_workbench; from local_agent_workbench.workspace_ui import asset; [importlib.import_module(m.name) for m in pkgutil.walk_packages(local_agent_workbench.__path__, local_agent_workbench.__name__ + ".")]; assert b"WorkbenchProjectControl" in asset("project_control.js").body; assert "unsafe-inline" not in asset("index.html").headers["content-security-policy"]'

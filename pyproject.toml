[project]
name = "local-agent-workbench"
version = "0.1.0"
description = "A durable local workbench for native Claude, Codex and local AI runtimes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
agent-workbench = "local_agent_workbench.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["local_agent_workbench*"]
namespaces = false

[tool.setuptools.package-data]
"local_agent_workbench.workspace_ui" = ["*.html", "*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project]
name = "local-agent-workbench"
version = "0.1.0"
description = "A durable local workbench for native Claude, Codex and local AI runtimes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "cancellation", "codex_accounts", "codex_adapter", "codex_events", "db", "diff_service", "diff_types", "engine", "event_stream", "job_submission", "logging_setup", "planning", "worktree", "write_boundary"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
